name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python src/benchmark.py generate --data data
      - run: git diff --exit-code -- data
      - run: python src/benchmark.py evaluate --data data --report reports/baseline.json
      - run: git diff --exit-code -- reports
